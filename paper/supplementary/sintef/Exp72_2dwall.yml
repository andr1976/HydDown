# ECCSEL/SINTEF dense-phase CO2 blowdown -- Exp72 (no-riser / gas release)
# Working HydDown input reproducing the manuscript results.
# P0 = 119.0 bar, T0 = 24.9 C, nozzle = 6.5 mm. Two-dimensional conjugate wall (wall_model: 2d); see Section 5.5 and Appendix A.
# If a near-triple flash step fails at time_step 0.1 s, reduce it to 0.02 s.

vessel:
  length: 1.0
  diameter: 0.273
  thickness: 0.0254
  heat_capacity: 500
  density: 7950
  orientation: vertical
  type: Flat-end
  wall_model: 2d
  bottom_thickness: 0.05
  flange_thickness: 0.083
  lid_thickness: 0.08
  lid_diameter: 0.58
initial:
  temperature: 298.05
  pressure: 11900000.0
  fluid: CO2
calculation:
  type: energybalance
  time_step: 0.1
  end_time: 400.0
  non_equilibrium: true
  h_gas_liquid: calc_two_sided
valve:
  flow: discharge
  type: none
  back_pressure: 101325.0
release:
  type: gas
  diameter: 0.0065
  discharge_coef: 1.0
  liquid_nonequilibrium: 0.0
  back_pressure: 101325.0
  atm_pressure: 101325.0
  eos: CoolProp
  solid_in_vessel: true
  solid_h_inner: cooper
  solid_h_gas_wall: churchill
  solid_h_gas_liquid: 0.0
  solid_h_gas_solid: 3.0
  discharge_location: 0.0
heat_transfer:
  type: specified_h
  temp_ambient: 298.05
  h_outer: 0.0
  h_inner: churchill
