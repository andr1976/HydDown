# Validation case: CARDICE JIP - 2 m3 CO2 sphere blowdown, TEST 10 (folder cardice-10).
# Ref: Vaillant et al., GHGT-15 (2021), SSRN 3823308 (test matrix Table 1); rig details
#      Jamois et al., Int. J. Greenhouse Gas Control 129 (2023) 103974. Open 1 Hz dataset
#      Zenodo DOI 10.5281/zenodo.17257910 (folder cardice-10). Experiments by Ineris.
#
# Test 10: pure CO2 at vapour/liquid equilibrium, 10 bar / -40 C, LIQUID (bottom) release.
# The lowest-pressure liquid release (with T6 20 bar and T8 15 bar). Like the others: a LIQUID
# release forms essentially NO in-vessel dry ice (retained ~5 kg model vs ~0 measured).
#
# DISCHARGE MODEL (single physical Cd + non-equilibrium liquid): single Cd 0.68, N=0 (no boost).
# UNLIKE T6/T8, T10's orifice is calibrated to the LIQUID rate, not the gas tail: at 10 bar the
# HEM liquid flux OVER-predicts (~12%), so the gas-inferred orifice (4.44 mm) drains the liquid
# too fast (early depletion). The liquid rate (~0.095 kg/s, steady) implies 4.09 mm, which matches
# the ~2.9 h duration. The gas tail then runs ~15% slow (gas implies ~4.44 mm) - a small fraction
# of the blowdown. (The metastable liquid boost fades with pressure: T6 20 bar N=0.267,
# T8 15 bar N=0.195, T10 10 bar N=0 - and here HEM even slightly over-predicts.)
#
# CALIBRATION (against cardice-10 1 Hz data):
#   - liquid_level 0.582 -> initial CoolProp mass 743.4 kg vs measured 743.3 kg (load cells)
#   - gas_temperature 239.38 K (-33.8 C): gas zone starts superheated per the top thermocouples
#   - orifice 4.09 mm from the (steady, full-drain) liquid rate 0.095 kg/s; Cd 0.68; N 0.0
#   - h_gas_liquid 2.0, h_outer 0.4, wall 0.072 m (shell-corrected ~4.82 t = measured 4.80 t).
# MATCH: initial mass; liquid rate 0.094 vs 0.095; liquid depletes 2.1 vs 2.0 h; duration 2.9 vs
# 2.9 h; retained mass (~no dry ice). Gas tail ~15% slow (gas/liquid orifice differ by ~8%).
vessel:
  length: 0.0                  # sphere: two hemispherical heads, no cylindrical section
  diameter: 1.58               # ~1556-1580 mm ID
  thickness: 0.072             # shell-corrected wall mass ~4.82 t = measured 4.80 t (incl flanges)
  heat_capacity: 450           # P355GH cp (Jamois Table 1)
  density: 7800.
  orientation: "horizontal"
  liquid_level: 0.582          # CALIBRATED to measured initial mass 743.3 kg
  type: "Hemispherical"
initial:
  temperature: 233.15          # -40 C (overridden: two-phase T set by P + liquid level)
  pressure: 1026000            # 10.26 bar (measured initial P sphere)
  fluid: "CO2"
  gas_temperature: 238.41      # -34.7 C: mid-band of top 3 gas-space thermocouples at t0
calculation:
  type: "energybalance"
  time_step: 5
  end_time: 12000              # blowdown reaches ~2 bar at ~2.9 h
  non_equilibrium: true
  h_gas_liquid: 2.0            # fixed low gas-liquid interphase HTC (near-adiabatic drain)
valve:
  flow: "discharge"
  type: "none"
  back_pressure: 101325.
release:
  type: "liquid"               # Test 10 is a liquid-space (bottom) release
  diameter: 0.00409            # calibrated to the LIQUID rate (0.095 kg/s, HEM) -> matches the 2.9 h
                               # duration. Gas tail implies ~4.44 mm but HEM liquid over-predicts at
                               # 10 bar, so the liquid needs the smaller orifice (see header).
  discharge_coef: 0.68         # single physical Cd
  liquid_nonequilibrium: 0.0   # no boost at 10 bar (HEM liquid already >= measured)
  back_pressure: 101325.
  atm_pressure: 101325.
  eos: "tcPR"
  solid_in_vessel: true        # crosses the triple point only at the very end (little/no solid)
  solid_h_inner: 20.0
  solid_h_gas_wall: "calc"     # natural-convection gas->wall HTC (inactive here - empties before plateau)
heat_transfer:
  type: "specified_h"
  temp_ambient: 283.15
  h_outer: 0.4                 # Jamois: measured insulation ~0.39 W/m2K
  h_inner: "calc"
