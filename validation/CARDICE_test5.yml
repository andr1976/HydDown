# Validation case: CARDICE JIP - 2 m3 CO2 sphere blowdown, TEST 5 (the paper's benchmark).
# Ref: Vaillant et al., "Vessel Blowdown of CO2-Rich Fluids: Experiments and Simulations",
#      GHGT-15 (2021), SSRN 3823308; open dataset Zenodo DOI 10.5281/zenodo.17257910.
#      Experiments by Ineris (2 m3 sphere, insulated, 200 bara / -60 C design).
#
# Test 5: pure CO2 at vapour/liquid equilibrium, 20 bar / -20 C, GAS (vapour-space) release.
# Paper Fig. 5 shows P(t), mass rate, fluid T and wall T vs the VessFire simulation. The paper
# describes exactly the three-phase behaviour this model implements:
#   blowdown at G/L equilibrium -> triple-point PLATEAU (gas+liquid+solid coexist) -> all
#   liquid converts to solid -> blowdown at gas/solid (sublimation) equilibrium.
# Gas-release tests produced > 450 kg of solid CO2 inside the sphere.
#
# Vessel filled with liquid to the MIDDLE of the sphere (half the volume).
# Orifice diameter is NOT given in the paper -> inferred from the gas rate via HEM (reliable).
#
# DISCHARGE: single physical Cd 0.68 + gas-inferred orifice 3.44 mm (uniform convention across
# the CARDICE set). BELOW-TRIPLE two-node wall: gas-contact wall = natural convection
# (solid_h_gas_wall "calc"); wetted (dry-ice-contact) wall = solid_h_inner 150.
#
# HydDown vs cardice-05 1 Hz data (h_outer 0.4, calc gas-wall):
#   initial + plateau mass rate, pressure plateau (5.26 bar), liquid/solid plateau -56.6 C: match
#   retained in-vessel dry ice   ~270 kg   vs measured ~217 kg   (right magnitude)
#   wetted (bottom) wall min  -78 C  vs measured -75 C  (match); gas-contact wall -30 vs top ~-29
#   GAP: the 0-D gas node runs colder than the measured warm top (~-42 C) - the gas is stratified
#     (warm on top), which a single 0-D gas node cannot represent (not the wall HTC: that is now
#     the physical natural-convection value).
vessel:
  length: 0.0                  # sphere (two hemispherical heads, no cylinder): V = 2.065 m3
  diameter: 1.58               # 1580 mm internal diameter
  thickness: 0.072             # tuned so the (shell-corrected) wall mass = 4.82 t, matching
                               # the measured 4.80 t total (60 mm P355GH shell + 3 flanges)
  heat_capacity: 450           # P355GH cp (paper Table 1)
  density: 7800.
  orientation: "horizontal"
  liquid_level: 0.635          # CALIBRATED to the measured initial mass 822.9 kg (load cells)
  type: "Hemispherical"
initial:
  temperature: 253.15          # -20 C (overridden: two-phase T set by P + liquid level)
  pressure: 2000000            # 20 bar (saturated)
  fluid: "CO2"
  gas_temperature: 255.94      # -17.2 C: mid-band of top 3 gas-space thermocouples at t0
                               # (also sets the initial gas-contact wall temperature)
calculation:
  type: "energybalance"
  time_step: 20
  end_time: 60000
  non_equilibrium: true
  h_gas_liquid: "calc_two_sided"
valve:
  flow: "discharge"
  type: "none"
  back_pressure: 101325.
release:
  type: "gas"                  # Test 5: vapour-space (mid-side) release
  diameter: 0.00344            # orifice inferred from the gas rate via HEM (~0.042 kg/s) at Cd 0.68
  discharge_coef: 0.68         # single physical Cd (uniform across the CARDICE set)
  back_pressure: 101325.
  atm_pressure: 101325.
  eos: "tcPR"
  solid_in_vessel: true        # crosses the triple point -> dry ice forms in-vessel
  solid_h_inner: 150.0         # wall<->dry-ice HTC below triple: sets the wetted (bottom) wall
                               # min. Sensitivity vs cardice-07 data: 20->-59C, 60->-70C,
                               # 150->-74C (matches measured -75C coldest sensor), 400->-75.5C
                               # (asymptote). Only affects the wetted wall - gas wall + retained
                               # dry ice are unchanged. 20 is low for dry-ice/steel contact.
  solid_h_gas_wall: "calc"     # natural-convection gas->wall HTC below triple (~11 W/m2K),
                               # instead of a fixed value (transport.h_inner, CoolProp T|gas)
  solid_h_gas_liquid: 0.0      # plateau interphase (flat liquid surface) - gas stays warm
  solid_h_gas_solid: 3.0       # descent interphase (dry-ice bank): calibrated so the descent
                               # gas (~-32 C) and retained dry ice (~211 kg) match the data
heat_transfer:
  type: "specified_h"
  temp_ambient: 283.15         # ~10 C ambient
  h_outer: 0.4                 # Jamois: measured insulation ~0.39 W/m2K (4.3 W/K over 11 m2)
  h_inner: "calc"
