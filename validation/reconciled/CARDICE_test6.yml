# CARDICE Test 6 - RECONCILED discharge sensitivity case.
#
# Same physical calibration (mass, temperatures, wall, HTCs) as the baseline
# validation/CARDICE_batch6.yml; ONLY the discharge parameterisation is changed, to use the TRUE
# restriction-orifice sizes reported in SSRN 4292065 (GHGT-16, Drescher et al., Table 1:
# 3/4/6 mm) instead of an orifice inferred from the gas rate at a single Cd.
#
# Reconciliation (calibrated to the raw 1 Hz Ineris data, CO2_blowdown-DJa):
#   * true orifice           : 3 mm (SSRN Table 1)
#   * Cd_gas = 0.84          : canonical sharp-edged gas-orifice coefficient. (The raw data
#                              gives 0.87-0.92, mean 0.89, constant along each pressure
#                              decline; 0.84 adopted here.) Used for a gas release and for
#                              the gas tail of a liquid release.
#   * Cd_liquid = 0.62       : two-phase / flashing sharp-orifice coefficient (Darby / API
#                              520). Used for the liquid discharge only.
#   * liquid_nonequilibrium N: delayed/metastable flashing boost on top of Cd_liquid,
#                              calibrated to the measured steady liquid-drain rate
#                              (T6 0.174, T8 0.175, T10 0.020). N is PRESSURE-SCALED
#                              (liquid_ne_pressure_scaled: true): it fades linearly with
#                              (P0-Ptr) to ~0 near the triple point as the vessel blows down
#                              (CARDICE/Ineris: N ~ 0.013*(P0-Ptr[bar])).
#
# Fallback: the baseline single-Cd files remain in validation/ unchanged.

vessel:
  length: 0.0
  diameter: 1.58
  thickness: 0.072
  heat_capacity: 450
  density: 7800.0
  orientation: horizontal
  liquid_level: 0.6238
  type: Hemispherical
initial:
  temperature: 253.15
  pressure: 1964000
  fluid: CO2
  gas_temperature: 256.24
calculation:
  type: energybalance
  time_step: 5
  end_time: 13000
  non_equilibrium: true
  h_gas_liquid: 2.0
valve:
  flow: discharge
  type: none
  back_pressure: 101325.0
release:
  type: liquid
  diameter: 0.003
  discharge_coef: 0.62
  discharge_coef_gas: 0.84
  liquid_nonequilibrium: 0.174
  liquid_ne_pressure_scaled: true
  back_pressure: 101325.0
  atm_pressure: 101325.0
  eos: tcPR
  solid_in_vessel: true
  solid_h_inner: 20.0
  solid_h_gas_wall: calc
heat_transfer:
  type: specified_h
  temp_ambient: 283.15
  h_outer: 0.4
  h_inner: calc
