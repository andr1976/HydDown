# Validation case: CARDICE JIP - 2 m3 CO2 sphere blowdown, TEST 8 (folder cardice-08).
# Ref: Vaillant et al., GHGT-15 (2021), SSRN 3823308 (test matrix Table 1); rig details
#      Jamois et al., Int. J. Greenhouse Gas Control 129 (2023) 103974. Open 1 Hz dataset
#      Zenodo DOI 10.5281/zenodo.17257910 (folder cardice-08). Experiments by Ineris.
#
# Test 8: pure CO2 at vapour/liquid equilibrium, 15 bar / -29 C, LIQUID (bottom) release.
# Reconciled against the 1 Hz load-cell, pressure and internal-temperature data (blowdown
# starts at t0 = 236 s in the raw file).
#
# Like Test 6 (cardice-06), a LIQUID release: essentially NO in-vessel dry ice (retained
# 4.6 kg model vs 3.7 kg measured), no triple-point plateau.
#
# DISCHARGE MODEL (single physical Cd + non-equilibrium liquid): the per-test orifice is NOT
# reported, so it is inferred from the GAS discharge, which is reliable HEM (matches a choked
# orifice and CoolProp HEM). The measured gas tail (0.0455 kg/s @12 bar) -> a 4.7 mm orifice at
# Cd 0.68. The LIQUID then discharges ~2x above equilibrium HEM: a saturated liquid through a
# short sharp orifice has no time to flash (metastable), so it runs toward the frozen all-liquid
# limit. This is captured by release.liquid_nonequilibrium N (HEM<->frozen blend), N=0.195 here.
# One Cd (0.68) fits BOTH phases: gas = HEM at 4.7 mm, liquid = HEM + NE boost.
#
# CALIBRATION (against cardice-08 1 Hz data):
#   - liquid_level 0.596 -> initial CoolProp mass 760 kg vs measured 757.7 kg (load cells)
#   - gas_temperature 250.82 K (-22.3 C): gas zone starts superheated per the top thermocouples
#   - orifice 4.7 mm from the gas tail (HEM); Cd 0.68; liquid_nonequilibrium 0.195 for the liquid
#   - h_gas_liquid 2.0 (fixed low interphase HTC), h_outer 0.4, wall 0.072 m (shell-corrected
#     mass ~4.82 t = measured 4.80 t total).
# MATCH: initial mass; initial LIQUID rate (0.311 vs 0.317); GAS-tail rate (0.030 vs 0.030);
# duration to 2 bar (1.33 vs 1.33 h); retained mass (~no dry ice). Both phases now match with
# a single Cd (the earlier ~30% fast tail was the over-sized 6 mm orifice from liquid-only calib).
vessel:
  length: 0.0                  # sphere: two hemispherical heads, no cylindrical section
  diameter: 1.58               # ~1556-1580 mm ID
  thickness: 0.072             # shell-corrected wall mass ~4.82 t = measured 4.80 t (incl flanges)
  heat_capacity: 450           # P355GH cp (Jamois Table 1)
  density: 7800.
  orientation: "horizontal"
  liquid_level: 0.596          # CALIBRATED to measured initial mass 757.7 kg
  type: "Hemispherical"
initial:
  temperature: 244.15          # -29 C (overridden: two-phase T set by P + liquid level)
  pressure: 1471000            # 14.71 bar (measured initial P sphere)
  fluid: "CO2"
  gas_temperature: 250.82      # -22.3 C: superheated gas zone per top thermocouples at t0
calculation:
  type: "energybalance"
  time_step: 5
  end_time: 8000               # blowdown reaches ~2 bar at ~1.0-1.3 h
  non_equilibrium: true
  h_gas_liquid: 2.0            # fixed low gas-liquid interphase HTC (near-adiabatic drain)
valve:
  flow: "discharge"
  type: "none"
  back_pressure: 101325.
release:
  type: "liquid"               # Test 8 is a liquid-space (bottom) release
  diameter: 0.0047             # TRUE orifice, inferred from the GAS tail via HEM (reliable):
                               # measured gas 0.0455 kg/s @12 bar -> 4.7 mm at Cd 0.68
  discharge_coef: 0.68         # single physical Cd for BOTH phases (gas = HEM at 4.7 mm)
  liquid_nonequilibrium: 0.195 # delayed/metastable flashing boost for the LIQUID: a saturated
                               # liquid through a short sharp orifice does not flash in time and
                               # discharges ~2x above equilibrium HEM (toward frozen all-liquid).
                               # N blends G = sqrt((1-N)*G_HEM^2 + N*G_frozen^2); 0.195 -> 0.317 kg/s.
  back_pressure: 101325.
  atm_pressure: 101325.
  eos: "tcPR"
  solid_in_vessel: true        # crosses the triple point only at the very end (little/no solid)
  solid_h_inner: 20.0
  solid_h_gas_wall: "calc"     # natural-convection gas->wall HTC (inactive here - empties before plateau)
heat_transfer:
  type: "specified_h"
  temp_ambient: 283.15
  h_outer: 0.4                 # Jamois: measured insulation ~0.39 W/m2K
  h_inner: "calc"
