# Munkejord Test 71 started at the TRUE dense state (122.6 bar / 25.2 C), no liquid_level.
# The dense single-phase pre-branch discharges + depressurises until the fluid flashes (~52 bar),
# then hands off to the standard NEM two-phase / dry-ice model.
vessel:
  length: 1.0
  diameter: 0.273
  thickness: 0.0254
  heat_capacity: 500
  density: 7950
  thermal_conductivity: 16.3   # SS316 -> triggers thermesh 1-D transient wall conduction
  orientation: "vertical"
  type: "Flat-end"
initial:
  temperature: 298.35          # 25.2 C (dense subcooled liquid at 122.6 bar)
  pressure: 12260000           # 122.6 bar
  fluid: "CO2"
calculation:
  type: "energybalance"
  time_step: 0.02
  end_time: 350.
  non_equilibrium: true
  h_gas_liquid: "calc_two_sided"
valve:
  flow: "discharge"
  type: "none"
  back_pressure: 101325.
release:
  type: "gas"
  diameter: 0.008
  discharge_coef: 1.0
  back_pressure: 101325.
  atm_pressure: 101325.
  eos: "CoolProp"
  solid_in_vessel: true
  solid_h_inner: "cooper"
  solid_h_gas_wall: "calc"
  solid_h_gas_liquid: 0.0
  solid_h_gas_solid: 3.0
heat_transfer:
  type: "specified_h"
  temp_ambient: 298.35
  h_outer: 0.0
  h_inner: "calc"
