# Munkejord Test 72 started at the TRUE dense state (118.9 bar / 24.9 C), no liquid_level.
# The dense single-phase pre-branch discharges + depressurises until the fluid flashes (~52 bar),
# then hands off to the standard NEM two-phase / dry-ice model.
vessel:
  length: 1.0
  diameter: 0.273
  thickness: 0.0254
  heat_capacity: 500
  density: 7950
  orientation: "vertical"
  type: "Flat-end"
initial:
  temperature: 298.05          # 24.9 C
  pressure: 11890000           # 118.9 bar
  fluid: "CO2"
calculation:
  type: "energybalance"
  time_step: 0.02
  end_time: 450.
  non_equilibrium: true
  h_gas_liquid: "calc_two_sided"
valve:
  flow: "discharge"
  type: "none"
  back_pressure: 101325.
release:
  type: "gas"
  diameter: 0.0065
  discharge_coef: 1.0
  back_pressure: 101325.
  atm_pressure: 101325.
  eos: "CoolProp"
  solid_in_vessel: true
  solid_h_inner: "cooper"
  solid_h_gas_wall: churchill
  solid_h_gas_liquid: 0.0
  solid_h_gas_solid: 3.0
heat_transfer:
  type: "specified_h"
  temp_ambient: 298.05
  h_outer: 0.0
  h_inner: "calc"
